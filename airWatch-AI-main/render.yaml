# One-click deploy: Render dashboard -> New -> Blueprint -> pick this repo
databases:
  - name: airwatch-db
    plan: free
    databaseName: airwatch
    user: airwatch

services:
  - type: web
    name: airwatch-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: airwatch-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: http://localhost:5173
